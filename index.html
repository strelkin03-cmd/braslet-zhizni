<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Браслет жизни</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: страница-стенд с одним или двумя телефонами 390×844 рядом; внутри телефона — фиксированная светлая палитра из ТЗ */
:root{
  --pg:#E9E8E0; --pg-fg:#292D28; --pg-mute:#666B5E; --pg-line:#D3D2C6; --pg-card:#F6F5F0; --pg-acc:#59623F; --pg-acc-fg:#fff;
  --bezel:#1D1F1B;
  /* палитра приложения (ТЗ) */
  --a-bg:#F5F4EF; --a-olive:#59623F; --a-olive2:#9DA583; --a-text:#292D28; --a-red:#EA5158;
  --a-card:#FFFFFF; --a-mute:#6F7468; --a-line:#E6E5DC; --a-tint:#ECEEE3; --a-ok:#4F8A4B;
  --f:'Manrope', 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--pg:#161814;--pg-fg:#E6E7DF;--pg-mute:#A0A496;--pg-line:#2F332B;--pg-card:#20231D;--pg-acc:#B8C096;--pg-acc-fg:#1A1C17;--bezel:#000;color-scheme:dark}}
:root[data-theme="dark"]{--pg:#161814;--pg-fg:#E6E7DF;--pg-mute:#A0A496;--pg-line:#2F332B;--pg-card:#20231D;--pg-acc:#B8C096;--pg-acc-fg:#1A1C17;--bezel:#000;color-scheme:dark}
html,body{height:100%}
body{background:var(--pg);color:var(--pg-fg);font-family:var(--f);margin:0}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--a-olive2);outline-offset:2px}

/* ---------- стенд ---------- */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--pg-line)}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.brand-mark{width:34px;height:34px;border-radius:11px;background:var(--a-olive);display:grid;place-items:center;flex:none}
.brand b{font-size:17px;font-weight:800;letter-spacing:-.01em;display:block}
.brand small{font-size:12px;color:var(--pg-mute);display:block}
.seg-pg{display:flex;background:var(--pg-card);border:1px solid var(--pg-line);border-radius:12px;padding:3px;gap:2px}
.seg-pg button{padding:7px 12px;border-radius:9px;font-size:13px;font-weight:600;color:var(--pg-mute);position:relative;white-space:nowrap}
.seg-pg button[aria-pressed="true"]{background:var(--pg-acc);color:var(--pg-acc-fg)}
.seg-pg .dot{position:absolute;top:4px;right:4px;width:8px;height:8px;border-radius:50%;background:var(--a-red)}
.tb{padding:8px 14px;border-radius:10px;border:1px solid var(--pg-line);background:var(--pg-card);font-size:13px;font-weight:600}
.tb.pri{background:var(--pg-acc);color:var(--pg-acc-fg);border-color:transparent}
.stage{display:flex;justify-content:center;gap:48px;padding-block:20px 8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.devcol{display:flex;flex-direction:column;align-items:center;gap:10px;min-width:0}
.devcol[hidden]{display:none!important}
.devlabel{font-size:13px;font-weight:700;color:var(--pg-mute);display:flex;align-items:center;gap:8px}
.devlabel i{font-style:normal;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--pg-card);border:1px solid var(--pg-line);font-size:12px}
.holder{position:relative;width:414px;height:868px;max-width:100%}
.err{margin:12px auto 0;max-width:900px;padding:10px 14px;border-radius:10px;background:#FCE3E4;color:#8E1F26;font-size:13px;font-weight:600}
.phone{position:absolute;left:0;top:0;width:414px;height:868px;transform-origin:0 0;background:var(--bezel);border-radius:62px;padding:12px;box-shadow:0 30px 60px -30px rgba(0,0,0,.45)}
.screen{position:relative;width:390px;height:844px;border-radius:50px;overflow:hidden;background:var(--a-bg);color:var(--a-text);font-family:var(--f);font-size:15px;line-height:1.35}
.devctl{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:440px}
.devctl select{font:inherit;font-size:13px;padding:7px 10px;border-radius:10px;border:1px solid var(--pg-line);background:var(--pg-card);color:var(--pg-fg);max-width:230px}
.hw{display:flex;align-items:center;gap:8px;padding:7px 12px;border-radius:10px;border:1px solid var(--pg-line);background:var(--pg-card);font-size:13px;font-weight:600}
.hw span{width:12px;height:12px;border-radius:50%;background:var(--a-red);box-shadow:0 0 0 3px rgba(234,81,88,.2)}
.guide{max-width:980px;margin:8px auto 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.guide details{background:var(--pg-card);border:1px solid var(--pg-line);border-radius:14px;padding:12px 16px}
.guide summary{font-weight:700;cursor:pointer;font-size:14px}
.guide ol{margin:10px 0 4px;padding-left:20px;display:grid;gap:8px;font-size:13.5px;color:var(--pg-fg)}
.guide ol b{font-weight:700}
.guide p{font-size:12.5px;color:var(--pg-mute);margin:10px 0 0;max-width:75ch}

/* ---------- приложение ---------- */
.scr{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--a-bg)}
.sb{height:50px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:6px 30px 0 34px;font-weight:700;font-size:15px;position:relative;z-index:3}
.island{position:absolute;left:50%;top:11px;width:122px;height:35px;margin-left:-61px;background:#000;border-radius:20px}
.sbi{display:flex;gap:5px;align-items:center}
.scr.red{background:var(--a-red)}
.scr.red .sb,.scr.dark .sb{color:#fff}
.body{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;display:flex;flex-direction:column}
.body::-webkit-scrollbar{display:none}
.pad{padding:4px 20px 24px;display:flex;flex-direction:column;gap:14px}
.hdr{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;padding:4px 12px 10px;min-height:52px}
.hdr h1{margin:0;font-size:19px;font-weight:800;text-align:center;letter-spacing:-.01em}
.ib{width:44px;height:44px;border-radius:14px;display:grid;place-items:center}
.ib:active{background:var(--a-tint)}
.card{background:var(--a-card);border-radius:20px;padding:16px}
.tap{cursor:pointer;transition:transform .12s}
.tap:active{transform:scale(.985)}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.mute{color:var(--a-mute)}
.sm{font-size:13px}
.xs{font-size:12px}
.b{font-weight:700}
.chev{color:var(--a-olive2);flex:none}
.btn{min-height:52px;border-radius:16px;font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:0 18px;transition:transform .12s, filter .12s}
.btn:active{transform:scale(.98);filter:brightness(.95)}
.btn-p{background:var(--a-olive);color:#fff}
.btn-o{background:var(--a-card);color:var(--a-olive);box-shadow:inset 0 0 0 1.5px var(--a-olive2)}
.btn-t{background:var(--a-tint);color:var(--a-olive)}
.btn-r{background:var(--a-red);color:#fff}
.btn-w{background:#fff;color:var(--a-red)}
.btn-link{min-height:44px;font-weight:600;color:var(--a-mute);text-decoration:underline;text-underline-offset:3px;font-size:14px}
.btn[disabled]{opacity:.45;pointer-events:none}
.ico{width:22px;height:22px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.ico.s{width:18px;height:18px}
.ico.l{width:28px;height:28px}
.av{border-radius:50%;display:grid;place-items:center;font-weight:800;flex:none;color:#3E4430}
.dot{width:8px;height:8px;border-radius:50%;background:var(--a-ok);display:inline-block;flex:none}
.dot.off{background:#B4B6AC}
.dot.warn{background:#D99A2B}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--a-tint);color:var(--a-olive)}
.pill.red{background:#FCE3E4;color:#C2363E}
.pill.ok{background:#E3EEDD;color:#3F7240}
.pill.gray{background:#ECECE6;color:#6F7468}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.metric .v{font-size:28px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.metric .v small{font-size:14px;font-weight:600;color:var(--a-mute);margin-left:3px}
.mi{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;margin-bottom:10px}
.mi.red{background:#FCE6E7;color:var(--a-red)}
.mi.ol{background:var(--a-tint);color:var(--a-olive)}
.list{background:var(--a-card);border-radius:20px;overflow:hidden}
.li{display:flex;align-items:center;gap:12px;padding:14px 16px;min-height:60px;width:100%;text-align:left}
.li + .li{border-top:1px solid var(--a-line)}
.li:active{background:#FAFAF6}
.seg{display:flex;background:var(--a-tint);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;height:36px;border-radius:11px;font-size:14px;font-weight:600;color:var(--a-mute)}
.seg button[aria-pressed="true"]{background:var(--a-olive);color:#fff}
.tabbar{flex:none;background:#fff;border-top:1px solid var(--a-line);display:grid;grid-template-columns:repeat(5,1fr);padding:8px 6px 26px}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:600;color:#8C9084;padding-top:2px}
.tab[aria-current="page"]{color:var(--a-olive);font-weight:800}
.tab .ico{width:24px;height:24px}
.own .tab{font-size:12.5px}
.own .tab .ico{width:28px;height:28px}
.tab.sos .sosb{width:52px;height:52px;margin-top:-22px;border-radius:50%;background:var(--a-red);color:#fff;display:grid;place-items:center;font-weight:800;font-size:14px;box-shadow:0 6px 16px -6px rgba(234,81,88,.8);border:4px solid #fff}
.tab.sos{color:var(--a-red)}
.toggle{width:50px;height:30px;border-radius:99px;background:#D6D7CD;position:relative;flex:none;transition:background .15s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .15s}
.toggle[aria-checked="true"]{background:var(--a-olive)}
.toggle[aria-checked="true"]::after{transform:translateX(20px)}
.toggle[aria-disabled="true"]{opacity:.55}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:700;color:var(--a-mute)}
.field input{height:54px;border-radius:14px;border:1.5px solid var(--a-line);background:#fff;padding:0 16px;font:inherit;font-size:17px;color:var(--a-text)}
.field input:focus{border-color:var(--a-olive2);outline:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:38px;padding:0 14px;border-radius:12px;background:#fff;box-shadow:inset 0 0 0 1.5px var(--a-line);font-weight:600;font-size:14px}
.chip[aria-pressed="true"]{background:var(--a-olive);color:#fff;box-shadow:none}
.note{display:flex;gap:10px;font-size:12.5px;color:var(--a-mute);line-height:1.45;padding:2px 4px}
.note .ico{width:18px;height:18px;margin-top:1px;color:var(--a-olive2)}
.chart-ax{font-size:10px;fill:#8C9084;font-family:var(--f)}
.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.pulse-ring{animation:pr 1.8s ease-out infinite;transform-origin:center;transform-box:fill-box}
@keyframes pr{0%{transform:scale(.6);opacity:.8}100%{transform:scale(1.8);opacity:0}}

/* оверлеи */
.ov{position:absolute;inset:0;background:rgba(30,32,27,.42);display:flex;align-items:flex-end;z-index:20;animation:fade .18s}
.sheet{background:var(--a-bg);width:100%;border-radius:28px 28px 0 0;padding:10px 20px 34px;display:flex;flex-direction:column;gap:12px;animation:up .22s ease-out}
.sheet .grab{width:40px;height:5px;border-radius:9px;background:#CFD0C5;margin:0 auto 6px}
.sheet h2{margin:0;font-size:21px;font-weight:800;letter-spacing:-.01em}
.sheet p{margin:0 0 6px;color:var(--a-mute);font-size:15px;line-height:1.45}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@keyframes fade{from{opacity:0}}
.toast{position:absolute;left:16px;right:16px;bottom:104px;background:#2D312A;color:#fff;border-radius:16px;padding:13px 16px;font-size:14px;font-weight:600;z-index:30;display:flex;gap:10px;align-items:center;animation:up .2s}
.push{position:absolute;left:10px;right:10px;top:54px;z-index:25;background:rgba(255,255,255,.97);border-radius:22px;padding:12px 14px;box-shadow:0 14px 30px -10px rgba(0,0,0,.35);display:flex;gap:12px;align-items:center;text-align:left;width:calc(100% - 20px);animation:drop .35s cubic-bezier(.2,1.2,.4,1)}
@keyframes drop{from{transform:translateY(-90px)}}
.push .pi{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;flex:none;color:#fff}
.call{position:absolute;inset:0;z-index:40;background:linear-gradient(180deg,#3F4630,#262A1F);color:#fff;display:flex;flex-direction:column;align-items:center;padding:120px 30px 70px;text-align:center;animation:fade .2s}
.call .endc{width:76px;height:76px;border-radius:50%;background:var(--a-red);display:grid;place-items:center;margin-top:auto}
.own{font-size:18px}
.own .hdr h1{font-size:23px}
.own .btn{min-height:60px;font-size:19px;border-radius:18px}
.own .li{min-height:72px}
.own .body{zoom:var(--tz,1)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* ---------- браслет ---------- */
#band{position:absolute;left:0;top:0;width:270px;height:868px;transform-origin:0 0}
.band{width:270px;height:868px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--f)}
.strap{width:148px;height:250px;background:linear-gradient(90deg,#9FA684,#C4CAAE 42%,#B3BA97 70%,#9CA382)}
.strap.t{border-radius:46px 46px 6px 6px;margin-bottom:-12px}
.strap.b{border-radius:6px 6px 46px 46px;margin-top:-12px;background-image:radial-gradient(circle,#8E9573 3.5px,transparent 4.5px),linear-gradient(90deg,#9FA684,#C4CAAE 42%,#B3BA97 70%,#9CA382);background-size:100% 28px,100% 100%;background-position:center 120px,0 0;background-repeat:repeat-y,no-repeat}
.case{position:relative;z-index:1;width:256px;height:256px;border-radius:76px;background:linear-gradient(145deg,#41453D,#1C1E1A);box-shadow:0 26px 44px -20px rgba(0,0,0,.55),inset 0 2px 3px rgba(255,255,255,.14);display:grid;place-items:center}
.bscr{position:relative;width:216px;height:216px;border-radius:60px;background:#0A0B09;overflow:hidden;color:#fff;user-select:none;-webkit-user-select:none;touch-action:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.04)}
.bbtn{position:absolute;right:-13px;top:50%;margin-top:-34px;width:17px;height:68px;border-radius:9px;background:linear-gradient(90deg,#C8434A,#EA5158);box-shadow:inset -2px 0 0 rgba(0,0,0,.18);touch-action:none;cursor:pointer}
.bbtn:active{transform:translateX(-3px)}
.band.shake .case{animation:bshake .11s linear 9}
@keyframes bshake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.bpage{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:16px;gap:2px}
.bz{position:absolute;top:0;bottom:0;width:44px;z-index:2;cursor:pointer}
.bz.l{left:0}.bz.r{right:0}
.bz:hover{background:linear-gradient(90deg,rgba(255,255,255,.06),transparent)}
.bz.r:hover{background:linear-gradient(270deg,rgba(255,255,255,.06),transparent)}
.bdots{position:absolute;bottom:13px;left:0;right:0;display:flex;justify-content:center;gap:5px;z-index:1}
.bdots i{width:5px;height:5px;border-radius:50%;background:#4A4D45}
.bdots i.on{background:#fff}
.bscr .ico{stroke:currentColor}
.beat{animation:beat 1s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.18)}30%{transform:scale(1)}}
.bring{animation:bring 1.6s ease-out infinite}
@keyframes bring{0%{transform:scale(.7);opacity:.7}100%{transform:scale(1.5);opacity:0}}
.bhint{font-size:12px;color:var(--pg-mute);text-align:center;max-width:270px;line-height:1.45;margin:0}

/* ---------- Telegram Mini App: приложение на весь экран ---------- */
html,body{height:100%;background:var(--a-bg);overscroll-behavior:none}
body{color:var(--a-text)}
#app{height:var(--tg-viewport-stable-height,100dvh);max-width:520px;margin:0 auto;display:flex;flex-direction:column;background:var(--a-bg);overflow:hidden}
#app .screen{position:relative;flex:1;min-height:0;width:100%;height:auto;border-radius:0}
#app .screen[hidden]{display:none}
#app .sb{display:none}
#app .push{top:8px}
#app .tabbar{padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
#app .toast{bottom:calc(96px + env(safe-area-inset-bottom,0px))}
#bandview{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:8px 16px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(180deg,#EDEBE3,#E2E0D6)}
#bandview[hidden]{display:none}
#bandhold{position:relative;flex:none}
#bandview .bhint{color:var(--a-mute)}
.sw{flex:none;display:flex;align-items:center;gap:8px;padding:8px 10px;background:#fff;border-bottom:1px solid var(--a-line);font-family:var(--f);color:var(--a-text)}
.sw[hidden]{display:none}
.sw .who{flex:1;min-width:0;font-size:11.5px;color:var(--a-mute);line-height:1.25}
.sw .who b{display:block;font-size:13.5px;color:var(--a-text)}
.sw button{position:relative;display:flex;align-items:center;gap:5px;height:36px;padding:0 10px;border-radius:12px;background:var(--a-tint);color:var(--a-olive);font-weight:700;font-size:12.5px;white-space:nowrap}
.sw button .dot{position:absolute;top:-3px;right:-3px;width:12px;height:12px;background:var(--a-red);border:2px solid #fff}
.sw .bico{width:34px;height:34px;border-radius:50%;background:#2C2F2A;color:#fff;display:grid;place-items:center;flex:none}
.err{position:fixed;left:8px;right:8px;bottom:8px;z-index:99}
</style>

<div id="app">
  <div class="sw" id="sw" hidden></div>
  <div class="screen" id="scr0"></div>
  <div class="screen" id="scr1" hidden></div>
  <div id="bandview" hidden><div id="bandhold"><div id="band"></div></div>
    <p class="bhint">Нажимайте у краёв экрана, чтобы листать.<br>Удерживайте красную кнопку 3 секунды — SOS.</p></div>
</div>
<div class="err" id="err" role="alert" hidden></div>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

function summary(key, per){
  const v = DATA[key][per].vals;
  if (key === 'steps') return fmt(v.reduce((a,b)=>a+b,0));
  const avg = v.reduce((a,b)=>a+b,0)/v.length;
  return key === 'temp' ? dec(avg.toFixed(1)) : String(Math.round(avg));
}

function lineChart(key, per, {h=112, color, big=false}={}){
  const D = DATA[key], d = D[per], w = 326, L = 30, R = 8, T = 8, B = 20;
  const iw = w-L-R, ih = h-T-B;
  const x = i => L + i*iw/(d.slots-1);
  const y = v => T + ih - (v - D.min)/(D.max - D.min)*ih;
  let g = '';
  D.ticks.forEach(t => { g += `<line x1="${L}" x2="${w-R}" y1="${y(t)}" y2="${y(t)}" stroke="#ECEBE3" stroke-width="1"/><text class="chart-ax" x="${L-6}" y="${y(t)+3.5}" text-anchor="end">${dec(t)}</text>`; });
  d.xl.forEach(([i,l]) => { g += `<text class="chart-ax" x="${x(i)}" y="${h-4}" text-anchor="${i===0?'start':(i===d.slots-1?'end':'middle')}">${l}</text>`; });
  const pts = d.vals.map((v,i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  const last = d.vals.length-1;
  const area = `${x(0)},${T+ih} ${pts} ${x(last)},${T+ih}`;
  let nowMark = '';
  if (d.now) nowMark = `<line x1="${x(last)}" x2="${x(last)}" y1="${T}" y2="${T+ih}" stroke="#C9CBBE" stroke-dasharray="3 3"/><text class="chart-ax" x="${x(last)+4}" y="${T+9}" style="font-weight:700">10:24</text>`;
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" role="img" aria-label="${D.name}: график">
    ${g}<polygon points="${area}" fill="${color}" opacity=".10"/>
    <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="${big?2.4:2}" stroke-linejoin="round" stroke-linecap="round"/>
    ${nowMark}<circle cx="${x(last)}" cy="${y(d.vals[last])}" r="4" fill="${color}" stroke="#fff" stroke-width="2"/></svg>`;
}
function barChart(per, {h=112}={}){
  const d = DATA.steps[per], w = 326, L = 34, R = 6, T = 8, B = 20, iw = w-L-R, ih = h-T-B;
  const max = per === 'day' ? 1200 : 7000;
  const ticks = per === 'day' ? [0,600,1200] : [0,3500,7000];
  const bw = iw/d.slots;
  let g = '';
  ticks.forEach(t => { const yy = T+ih - t/max*ih; g += `<line x1="${L}" x2="${w-R}" y1="${yy}" y2="${yy}" stroke="#ECEBE3"/><text class="chart-ax" x="${L-6}" y="${yy+3.5}" text-anchor="end">${t>=1000?dec((t/1000).toFixed(t%1000?1:0))+'к':t}</text>`; });
  d.vals.forEach((v,i) => { const bh = Math.max(v/max*ih, v?2:0); const last = i===d.vals.length-1;
    g += `<rect x="${(L+i*bw+bw*.18).toFixed(1)}" y="${(T+ih-bh).toFixed(1)}" width="${(bw*.64).toFixed(1)}" height="${bh.toFixed(1)}" rx="${Math.min(3,bw*.3).toFixed(1)}" fill="${last?'#59623F':'#B6BD9A'}"/>`; });
  d.xl.forEach(([i,l]) => { g += `<text class="chart-ax" x="${L+i*bw+bw/2}" y="${h-4}" text-anchor="${i===0?'start':(i===d.slots-1?'end':'middle')}">${l}</text>`; });
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" role="img" aria-label="Активность: шаги">${g}</svg>`;
}

function av(name, size=48){
  const parts = name.split(' ');
  const ini = parts.length > 1 ? parts[0][0] + parts[1][0] : parts[0][0];
  const bg = TONES[ini] || '#E1E3D6';
  if (PHOTOS[name]) return `<div class="av" role="img" aria-label="${name}" style="width:${size}px;height:${size}px;background:${bg} url(${PHOTOS[name]}) center/cover no-repeat"></div>`;
  return `<div class="av" style="width:${size}px;height:${size}px;background:${bg};font-size:${Math.round(size*.36)}px">${ini}</div>`;
}

const devices = [];
class Device {
  constructor(i){
    this.i = i; this.el = document.getElementById('scr'+i);
    this.timers = []; this.reset();
    this.el.addEventListener('click', e => this.onClick(e));
    this.el.addEventListener('input', e => { const f = e.target.dataset.field; if (f) this.ls[f] = e.target.value; });
  }
  reset(){
    this.clear();
    this.st = {role:null, period:'day', filter:'all', textScale:1, mapZoom:1, user:null};
    this.stack = [{id:'A0', p:{}}]; this.ls = {};
    this.overlay = null; this.call = null; this.toastMsg = null; this.push = null;
  }
  get cur(){ return this.stack[this.stack.length-1]; }
  clear(){ this.timers.forEach(t => { clearTimeout(t); clearInterval(t); }); this.timers = []; }
  after(ms, fn){ this.timers.push(setTimeout(fn, ms)); }
  every(ms, fn){ this.timers.push(setInterval(fn, ms)); }
  nav(id, p={}, mode='push'){
    this.clear(); this.ls = {}; this.overlay = null;
    const sc = S[id];
    if (sc.role) this.st.role = sc.role;
    if (mode === 'tab') this.stack = [{id, p}];
    else if (mode === 'replace') this.stack[this.stack.length-1] = {id, p};
    else if (mode === 'root') this.stack = p.under ? [{id:p.under, p:{}}, {id, p}] : [{id, p}];
    else this.stack.push({id, p});
    this.scrollTop = 0;
    if (sc.enter) sc.enter(this, p);
    this.render(true); updateChrome();
  }
  back(){
    if (this.stack.length > 1){ this.clear(); this.ls = {}; this.overlay = null; this.stack.pop(); const c = this.cur; if (S[c.id].enter) S[c.id].enter(this, c.p); this.render(true); updateChrome(); }
    else { const sc = S[this.cur.id]; const home = sc.tabs === 'rel' ? 'B1' : sc.tabs === 'owner' ? 'A1' : null; if (home && home !== this.cur.id) this.nav(home, {}, 'tab'); }
  }
  toast(msg, ms=2800){ this.toastMsg = msg; this.render(); clearTimeout(this._tt); this._tt = setTimeout(() => { this.toastMsg = null; this.render(); }, ms); }
  render(fresh=false){
    const body = this.el.querySelector('.body');
    const keep = (!fresh && body) ? body.scrollTop : 0;
    const sc = S[this.cur.id];
    const r = sc.render(this, this.cur.p);
    const kind = sc.tabs === 'owner' || sc.own ? 'own' : '';
    let html = `<div class="scr ${kind} ${r.cls||''}" style="--tz:${this.st.textScale}">${statusBar()}<div class="body">${r.body}</div>${sc.tabs ? tabbar(sc) : ''}</div>`;
    if (this.push) html += pushHtml(this.push);
    if (this.overlay) html += sheetHtml(this.overlay);
    if (this.toastMsg) html += `<div class="toast" role="status">${ic('check','s')}<span>${this.toastMsg}</span></div>`;
    if (this.call) html += callHtml(this.call);
    setHTML(this.el, html);
    const nb = this.el.querySelector('.body'); if (nb) nb.scrollTop = keep;
  }
  onClick(e){
    const t = e.target.closest('[data-go],[data-tab],[data-back],[data-act]');
    if (!t || !this.el.contains(t)) return;
    if (t.classList.contains('ov') && e.target !== t) return;
    const ds = t.dataset;
    if ('back' in ds) return this.back();
    if (ds.tab) return this.nav(ds.tab, {}, 'tab');
    if (ds.go) return this.nav(ds.go, ds.arg ? {id: ds.arg} : {});
    if (ds.act && ACT[ds.act]) ACT[ds.act](this, ds, t);
  }
}

const TABS = {
  owner:[['A1','home','Главная'],['A2','heart','Здоровье'],['A5','sos','SOS'],['A3','users','Семья'],['A4','watch','Браслет']],
  rel:[['B1','home','Главная'],['B2','chart','Мониторинг'],['B3','pin','Карта'],['B5','bell','События'],['B7','users','Семья']]
};
function tabbar(sc){
  return `<nav class="tabbar">${TABS[sc.tabs].map(([id,icn,l]) => id === 'A5'
    ? `<button class="tab sos" data-tab="A5" ${sc.tab===id?'aria-current="page"':''}><span class="sosb">SOS</span>${l === 'SOS' ? 'Помощь' : l}</button>`
    : `<button class="tab" data-tab="${id}" ${sc.tab===id?'aria-current="page"':''}>${ic(icn)}${l}</button>`).join('')}</nav>`;
}
function hdr(title, {back=true, right=''}={}){
  return `<div class="hdr">${back ? `<button class="ib" data-back aria-label="Назад">${ic('back')}</button>` : '<span></span>'}<h1>${title}</h1>${right || '<span></span>'}</div>`;
}
function sheetHtml(o){

  logout(d){ d.reset(); d.render(true); updateChrome(); },

  sendCode(d){ d.nav('CODE'); },
  verify(d){ d.nav(d.st.role === 'owner' ? 'PAIR' : 'LINK'); },
};

function sendSos(source, owner){
  const t = demoTime();
  const s = {id:'s'+Date.now(), label:'Сегодня, '+t, time:t, source, status:'sent', sentAt:t};
  W.sos.push(s);
  W.events.unshift({id:'e'+s.id, type:'sos', sosId:s.id});
  devices.forEach(x => { if (x !== owner && x.st.role !== 'owner') x.push = {kind:'sos', id:s.id, title:'SOS — Анна Ивановна', text:`Требуется помощь · ${t} · ул. Лесная, 12`}; });
  owner.st.role = 'owner';
  owner.nav('A7', {id:s.id, under:'A1'}, 'root');
  emit();
  onSosHook(owner);
}

S.A7 = {label:'А7 · Помощь вызвана', group:'Владелец', role:'owner', own:true,

    const step = (ok, title, sub) => `<div class="row" style="align-items:flex-start;gap:14px"><span style="width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;${ok?'background:var(--a-ok);color:#fff':'background:var(--a-tint);color:var(--a-olive2)'}">${ok?ic('check','s'):ic('clock','s')}</span><div><div style="font-size:18px;font-weight:700">${title}</div>${sub?`<div class="mute" style="font-size:15px">${sub}</div>`:''}</div></div>`;
    return {body:`
    <div style="padding:20px 22px 0;text-align:center">
      <div style="width:84px;height:84px;border-radius:50%;margin:10px auto 0;display:grid;place-items:center;background:${done?'#E3EEDD':'#FCE6E7'};color:${done?'var(--a-ok)':'var(--a-red)'}">${ic(done?'check':'alert','l').replace('ico l','ico" style="width:42px;height:42px')}</div>

        ${step(going, going?'Елена: «Я уже еду»':'Ждём ответа близких', going?s.enrouteAt:'')}

    </div>`};
  }};

      <div style="font-size:12px;color:#D4D7CC;font-weight:700;line-height:1.3">Удерживайте 3 с<br><span style="color:#8D9286;font-weight:600">или кнопку сбоку</span></div></div>`,
];
class Band {
  constructor(el){
    this.el = el; this.idx = 0; this.holdT0 = 0; this.timer = null; this.seen = null; this.lastKey = 'page'; this.btnDown = 0; this.fromBtn = false;
    setHTML(el, `<div class="band"><div class="strap t"></div><div class="case"><div class="bscr" role="group" aria-label="Экран браслета"></div>
      <button class="bbtn" data-band="btn" aria-label="Кнопка SOS на браслете: удерживайте 3 секунды"></button></div><div class="strap b"></div></div>`);
    this.body = el.querySelector('.band'); this.scr = el.querySelector('.bscr');
    el.addEventListener('pointerdown', e => { const t = e.target.closest('[data-band]'); if (!t) return;
      const k = t.dataset.band; if (k === 'btn' || k === 'hold'){ e.preventDefault(); this.press(k); } });
    window.addEventListener('pointerup', () => this.release());
    window.addEventListener('pointercancel', () => this.release());
    el.addEventListener('contextmenu', e => { if (e.target.closest('[data-band]')) e.preventDefault(); });
    el.addEventListener('click', e => { const t = e.target.closest('[data-band]'); if (!t) return; const k = t.dataset.band, n = BAND_PAGES.length;
      if (k === 'prev'){ this.idx = (this.idx + n - 1) % n; this.render(); }
      else if (k === 'next'){ this.idx = (this.idx + 1) % n; this.render(); }
      else if (k === 'dismiss'){ this.seen = t.dataset.id; this.idx = 0; this.render(); } });
  }
  press(k){
    this.btnDown = Date.now(); this.fromBtn = k === 'btn';
    if (activeSos()) return;
    this.holdT0 = Date.now();
    if (typeof haptic === 'function') haptic('light');
    this.timer = setInterval(() => { if (Date.now() - this.holdT0 >= 3000) this.fire(); else this.render(); }, 60);
    this.render();
  }
  release(){
    if (!this.btnDown) return;
    const short = Date.now() - this.btnDown < 400, fromBtn = this.fromBtn; this.btnDown = 0;
    if (this.timer){ clearInterval(this.timer); this.timer = null; this.holdT0 = 0; }
    if (short && fromBtn){ const last = W.sos[W.sos.length-1]; if (last && last.status === 'resolved') this.seen = last.id; this.idx = 0; }
    this.render();
  }
  fire(){
    clearInterval(this.timer); this.timer = null; this.holdT0 = 0; this.btnDown = 0;
    const owner = devices.find(d => d.st.role === 'owner') || devices[0];
    sendSos('band', owner);
  }
  state(){
    if (this.holdT0) return 'hold';
    const a = activeSos(); if (a) return a.status === 'enroute' ? 'enroute' : 'sent';
    const last = W.sos[W.sos.length-1];
    if (last && !last.past && last.status === 'resolved' && this.seen !== last.id) return 'resolved';
    return 'page';
  }
  render(){
    const st = this.state(); let html = '', bg = '#0A0B09';
    if (st === 'hold'){
      const p = Math.min(1, (Date.now() - this.holdT0)/3000), C = 2*Math.PI*84, left = Math.max(1, Math.ceil(3 - p*3));
      bg = '#B8333B';
      html = `<div class="bpage"><svg viewBox="0 0 190 190" width="190" height="190" style="position:absolute;top:13px;left:13px;transform:rotate(-90deg)">
        <circle cx="95" cy="95" r="84" fill="none" stroke="rgba(255,255,255,.22)" stroke-width="9"/>
        <circle cx="95" cy="95" r="84" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-p)}"/></svg>
        <div style="font-size:40px;font-weight:800;line-height:1">SOS</div><div style="font-size:30px;font-weight:800;margin-top:2px">${left}</div>
        <div style="font-size:11px;font-weight:700;opacity:.85;margin-top:4px">Отпустите — отмена</div></div>`;
    } else if (st === 'sent'){
      const a = activeSos(); bg = '#EA5158';
      html = `<div class="bpage"><span class="bring" style="position:absolute;width:150px;height:150px;border-radius:50%;border:3px solid rgba(255,255,255,.6)"></span>
        ${ic('alert','l')}<div style="font-size:21px;font-weight:800;margin-top:6px;line-height:1.1">SOS<br>отправлен</div>
        <div style="font-size:11.5px;font-weight:700;opacity:.92;margin-top:6px;line-height:1.3">Елена и Алексей<br>получили сигнал · ${a.time}</div></div>`;
    } else if (st === 'enroute'){
      const a = activeSos(); bg = '#59623F';
      html = `<div class="bpage">${ic('car','l')}<div style="font-size:21px;font-weight:800;margin-top:6px;line-height:1.1">Елена<br>едет к вам</div>
        <div style="font-size:11.5px;font-weight:700;opacity:.85;margin-top:6px;line-height:1.3">Оставайтесь на месте<br>с ${a.enrouteAt}</div></div>`;
    } else if (st === 'resolved'){
      const last = W.sos[W.sos.length-1]; bg = '#3F7240';
      html = `<button class="bpage" data-band="dismiss" data-id="${last.id}" style="color:#fff;width:100%">
        <span style="width:58px;height:58px;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center">${ic('check','l')}</span>
        <div style="font-size:19px;font-weight:800;margin-top:8px;line-height:1.15">Ситуация<br>решена</div>
        <div style="font-size:11px;font-weight:700;opacity:.8;margin-top:6px">Нажмите, чтобы закрыть</div></button>`;
    } else {
      html = BAND_PAGES[this.idx]() + `<button class="bz l" data-band="prev" aria-label="Предыдущий экран"></button><button class="bz r" data-band="next" aria-label="Следующий экран"></button>
        <div class="bdots">${BAND_PAGES.map((_, i) => `<i class="${i === this.idx ? 'on' : ''}"></i>`).join('')}</div>`;
    }
    if (st !== this.lastKey){
      if (st === 'sent' || st === 'enroute' || st === 'resolved'){
        this.body.classList.remove('shake'); void this.body.offsetWidth; this.body.classList.add('shake');
        clearTimeout(this._sh); this._sh = setTimeout(() => this.body.classList.remove('shake'), 1100);
        if (typeof haptic === 'function') haptic(st === 'sent' ? 'error' : 'success');
      }
      this.lastKey = st;
    }
    this.scr.style.background = bg;
    setHTML(this.scr, html);
  }
}

/* ================= Telegram Mini App ================= */
const tg = (window.Telegram && window.Telegram.WebApp) || null;
const inTG = !!(tg && tg.initData);
let active = 0, showBand = false;
function haptic(kind){
  try { if (!inTG) return;
    if (kind === 'light' || kind === 'medium' || kind === 'heavy') tg.HapticFeedback.impactOccurred(kind);
    else tg.HapticFeedback.notificationOccurred(kind);
  } catch (e) {}
}
function onSosHook(owner){
  haptic('error');
  owner.toast('Сигнал ушёл Елене. Переключитесь на неё вверху, чтобы ответить', 4200);
}
function fitBand(){
  const v = document.getElementById('bandview'); if (v.hidden) return;
  const h = v.clientHeight - 70, w = v.clientWidth - 32;
  const s = Math.max(0.35, Math.min(1, h/868, w/270));
  const hb = document.getElementById('bandhold');
  hb.style.width = (270*s)+'px'; hb.style.height = (868*s)+'px';
  document.getElementById('band').style.transform = `scale(${s})`;
}
function updateChrome(){
  const me = devices[active], other = devices[1 - active];
  const sw = document.getElementById('sw');
  const ownerDev = devices.find(d => d.st.role === 'owner');
  const show = me.st.role && other.st.role && (showBand || S[me.cur.id].group !== 'Вход');
  sw.hidden = !show;
  if (show){
    const nm = r => r === 'owner' ? 'Анна Ивановна' : 'Елена';
    const short = r => r === 'owner' ? 'Анну Ивановну' : 'Елену';
    if (showBand){
      setHTML(sw, `<span class="bico">${ic('watch','s')}</span><div class="who">Вы смотрите<b>Браслет Анны Ивановны</b></div>
        <button data-sw="phone">${ic('back','s')}К телефонам</button>`);
    } else {
      setHTML(sw, `${av(nm(me.st.role), 34)}<div class="who">Вы смотрите как<b>${nm(me.st.role)}</b></div>
        ${ownerDev ? `<button data-sw="band" aria-label="Показать браслет">${ic('watch','s')}Браслет</button>` : ''}
        <button data-sw="role" aria-label="Переключиться">${ic('refresh','s')}${short(other.st.role)}${other.push ? '<span class="dot"></span>' : ''}</button>`);
    }
  }
  devices.forEach((d, i) => { document.getElementById('scr' + i).hidden = showBand || i !== active; });
  document.getElementById('bandview').hidden = !showBand;
  fitBand();
  if (tg && tg.BackButton){ try { if (showBand || me.stack.length > 1) tg.BackButton.show(); else tg.BackButton.hide(); } catch (e) {} }
}
document.getElementById('sw').addEventListener('click', e => {
  const t = e.target.closest('[data-sw]'); if (!t) return; haptic('light');
  const k = t.dataset.sw;
  if (k === 'band'){ showBand = true; band.render(); }
  else if (k === 'phone'){ showBand = false; }
  else { active = 1 - active; devices[active].render(); }
  updateChrome();
});

W = freshWorld();
devices.push(new Device(0), new Device(1));
band = new Band(document.getElementById('band'));
band.render();
devices.forEach(d => d.render(true));
updateChrome();
window.addEventListener('resize', fitBand);
setInterval(() => { if (band && band.state() === 'page' && band.idx === 0) band.render(); }, 15000);

if (tg){
  try { tg.ready(); tg.expand(); } catch (e) {}
  try { tg.setHeaderColor('#F5F4EF'); tg.setBackgroundColor('#F5F4EF'); } catch (e) {}
  try { if (tg.setBottomBarColor) tg.setBottomBarColor('#FFFFFF'); } catch (e) {}
  try { if (tg.disableVerticalSwipes) tg.disableVerticalSwipes(); } catch (e) {}
  try { tg.BackButton.onClick(() => { if (showBand){ showBand = false; updateChrome(); } else devices[active].back(); }); } catch (e) {}
  try { tg.onEvent('viewportChanged', fitBand); } catch (e) {}
}
} catch (e) { showErr(e && e.message ? e.message : String(e)); }
})();
</script>
